<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2020">
<meta name="referrer" content="no-referrer">
<title>KinemaLoom</title>
<!-- Installable: on an iPhone, only an app on the Home Screen keeps its data
     past seven days of not being opened. See installAdvice in app.js. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KinemaLoom">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="style.css?v=0afa75c6b8">
<script src="js/vendor/jsQR.js?v=0afa75c6b8"></script>
<script type="module" src="js/app.js?v=0afa75c6b8"></script>
</head>
<body>
<!-- data-i18n names the message that fills an element; app.js sets it when the
     language is chosen, so a screen never shows a mix of two languages. -->

<!-- A browser without what the app needs -->
<section id="unsupported" class="page centred" hidden>
  <div class="logo"><img src="KinemaLoom.jpg" alt="KinemaLoom"></div>
  <h1 data-i18n="patient.unsupported.title"></h1>
  <p class="sub" id="unsupported-text"></p>
</section>

<!-- No programme yet -->
<section id="welcome" class="page centred" hidden>
  <div class="logo"><img src="KinemaLoom.jpg" alt="KinemaLoom"></div>
  <h1 data-i18n="patient.home_exercise"></h1>
  <p class="sub" data-i18n="patient.welcome.sub"></p>
  <div class="install" data-install hidden></div>
  <button class="big primary" data-go="scan" data-i18n="patient.scan.title"></button>
  <button class="small" id="language-welcome"></button>
  <p class="safety" data-i18n="patient.safety"></p>
</section>

<!-- Scanning the clinic's programme QR -->
<section id="scan" class="page" hidden>
  <header><button class="small" data-go="back" data-i18n="patient.back"></button>
    <h2 data-i18n="patient.scan.title"></h2></header>
  <div class="camera"><video id="scan-video" playsinline muted></video><div class="aim"></div></div>
  <p class="sub" id="scan-msg"></p>
</section>

<!-- Programme loaded -->
<section id="home" class="page" hidden>
  <div class="logo small"><img src="KinemaLoom.jpg" alt="KinemaLoom"></div>
  <h1 id="home-title"></h1>
  <p class="sub" id="home-from"></p>
  <ol id="home-list" class="items"></ol>
  <button class="big primary" id="home-start"></button>
  <button class="big" data-go="send" id="home-send"></button>
  <p class="sub" id="home-sessions"></p>
  <div class="install" data-install hidden></div>
  <footer>
    <button class="small" data-go="scan" data-i18n="patient.home.rescan"></button>
    <button class="small" id="language"></button>
    <button class="small" id="forget" data-i18n="patient.home.forget"></button>
  </footer>
  <p class="safety" data-i18n="patient.safety"></p>
</section>

<!-- Exercising -->
<section id="exercise" class="page exercise" hidden>
  <header>
    <div><h2 id="ex-title"></h2><p class="cue" id="ex-cue"></p></div>
    <button class="small toggle" id="sound"></button>
  </header>
  <div class="stage">
    <div class="camera live"><canvas id="live"></canvas>
      <div class="angle" id="angle"></div>
      <div class="loading" id="loading"></div>
    </div>
    <div class="warning" id="warning"></div>
  </div>
  <div class="panel">
    <div class="counts">
      <canvas id="figure"></canvas>
      <div><div class="count" id="count">0 / 0</div><div class="count-sub" id="count-sub"></div></div>
    </div>
    <div class="status" id="status"></div>
    <ol class="strip" id="strip"></ol>
    <div class="buttons">
      <button class="small" id="finish" data-i18n="patient.button.finish"></button>
      <button class="big primary" id="start" data-i18n="patient.button.start"></button>
      <button class="big" id="skip" data-i18n="patient.button.skip_rest" hidden></button>
      <button class="big" id="next"></button>
    </div>
  </div>
</section>

<!-- After a session: how did it feel -->
<section id="feedback" class="page centred" hidden>
  <h1 data-i18n="patient.feedback.title"></h1>
  <p class="sub" data-i18n="patient.feedback.sub"></p>
  <p class="label" data-i18n="patient.feedback.pain"></p>
  <div class="choices" id="pain"></div>
  <p class="label" data-i18n="patient.feedback.effort"></p>
  <div class="choices" id="effort"></div>
  <div class="row">
    <button class="big" id="fb-skip" data-i18n="patient.button.skip"></button>
    <button class="big primary" id="fb-save" data-i18n="patient.button.save"></button>
  </div>
</section>

<!-- Saved -->
<section id="done" class="page centred" hidden>
  <h1 id="done-title"></h1>
  <ul class="summary" id="done-list"></ul>
  <p class="sub" id="done-text"></p>
  <button class="big primary" data-go="send" data-i18n="patient.home.send"></button>
  <button class="big" data-go="home" data-i18n="patient.done.back"></button>
</section>

<!-- Results as an animated QR for the clinic computer's camera -->
<section id="send" class="page centred" hidden>
  <header><button class="small" data-go="home" data-i18n="patient.send.done"></button>
    <h2 data-i18n="patient.send.title"></h2></header>
  <p class="sub" data-i18n="patient.send.how"></p>
  <p class="label" id="send-batch" hidden></p>
  <canvas id="qr"></canvas>
  <p class="sub" id="send-part"></p>
  <button class="big" id="send-next" hidden></button>
</section>

</body>
</html>
